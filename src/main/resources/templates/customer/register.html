<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="customer/fragments :: html-header"></head>

<body class="min-h-screen bg-gray-50">

<header th:replace="customer/fragments :: header"></header>

<main class="py-12 px-4">
    <div class="mx-auto max-w-md">
        
        <!-- Card Container -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100">
            
            <!-- Decorative Header -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 py-6 px-8">
                <div class="flex items-center justify-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-white">Create Account</h1>
                </div>
                <p class="text-blue-100 text-center mt-2 text-sm">Join our community today</p>
            </div>

            <!-- Form Content -->
            <div class="p-8">
                <!-- Form -->
                <form th:action="@{/customer/register/process}" th:object="${customer}" method="post" class="space-y-5">
                    
                    <!-- Name Input -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                            Full Name
                        </label>
                        <div class="relative">
                            <input type="text" th:field="*{name}" id="name"
                                   class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg
                                          focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                                          focus:outline-none transition placeholder-gray-400"
                                   placeholder="John Doe"/>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Email Input -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                            Email Address
                        </label>
                        <div class="relative">
                            <input type="email" th:field="*{email}" id="email"
                                   class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg
                                          focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                                          focus:outline-none transition placeholder-gray-400"
                                   placeholder="you@example.com"/>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                            Password
                        </label>
                        <div class="relative">
                            <input type="password" th:field="*{password}" id="password"
                                   class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg
                                          focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                                          focus:outline-none transition placeholder-gray-400"
                                   placeholder="••••••••"/>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                            </div>
                        </div>
                        <p class="mt-1 text-xs text-gray-500">Must be at least 8 characters</p>
                    </div>

                    <!-- Address Input -->
                    <div>
                        <label for="address" class="block text-sm font-medium text-gray-700 mb-1">
                            Address
                        </label>
                        <div class="relative">
                            <input type="text" th:field="*{address}" id="address"
                                   class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg
                                          focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                                          focus:outline-none transition placeholder-gray-400"
                                   placeholder="123 Main Street, City"/>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Phone Input -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">
                            Phone Number
                        </label>
                        <div class="relative">
                            <input type="text" th:field="*{phone}" id="phone"
                                   class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg
                                          focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                                          focus:outline-none transition placeholder-gray-400"
                                   placeholder="+1 (555) 123-4567"/>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Terms Checkbox -->
                    <div class="flex items-start mt-6">
                        <input type="checkbox" id="terms" class="mt-1 mr-3 rounded border-gray-300 text-blue-600 focus:ring-blue-500"/>
                        <label for="terms" class="text-sm text-gray-600">
                            I agree to the 
                            <a href="#" class="text-blue-600 hover:underline font-medium">Terms of Service</a> 
                            and 
                            <a href="#" class="text-blue-600 hover:underline font-medium">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                            class="w-full mt-6 py-3 bg-gradient-to-r from-blue-600 to-blue-700 
                                   text-white font-semibold rounded-lg shadow-md
                                   hover:from-blue-700 hover:to-blue-800 hover:shadow-lg
                                   transform hover:-translate-y-0.5 transition-all duration-200">
                        Create Account
                    </button>

                </form>

                <!-- Divider -->
                <div class="my-8 flex items-center">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="mx-4 text-sm text-gray-500">Or continue with</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-2 gap-3">
                    <button type="button"
                            class="py-2.5 px-4 border border-gray-300 rounded-lg 
                                   flex items-center justify-center gap-2 hover:bg-gray-50 transition">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span class="text-sm font-medium text-gray-700">Google</span>
                    </button>
                    <button type="button"
                            class="py-2.5 px-4 border border-gray-300 rounded-lg 
                                   flex items-center justify-center gap-2 hover:bg-gray-50 transition">
                        <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        <span class="text-sm font-medium text-gray-700">Facebook</span>
                    </button>
                </div>

                <!-- Login Link -->
                <div class="mt-8 text-center pt-6 border-t border-gray-200">
                    <p class="text-sm text-gray-600">
                        Already have an account?
                        <a th:href="@{/customer/login}" 
                           class="text-blue-600 font-semibold hover:text-blue-800 hover:underline ml-1">
                            Sign in here
                        </a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Security Note -->
        <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-100 text-center">
            <p class="text-sm text-blue-800 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                Your information is secure and encrypted
            </p>
        </div>

    </div>
</main>

<footer th:replace="customer/fragments :: footer"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="customer/fragments :: html-header"></head>

<body class="flex flex-col min-h-screen bg-gray-50">

    <header th:replace="customer/fragments :: header"></header>

    <main class="flex-1 py-12">
        <div class="max-w-4xl mx-auto px-4">
            <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
                <div class="grid md:grid-cols-2">
                    <!-- Image Section -->
                    <div class="p-8 md:p-12 bg-gradient-to-br from-gray-50 to-white">
                        <div class="aspect-square flex items-center justify-center">
                            <img th:src="@{/Upload/{img}(img=${product.image})}"
                                 alt="Product Image"
                                 class="max-h-full max-w-full object-contain">
                        </div>
                    </div>

                    <!-- Info Section -->
                    <div class="p-8 md:p-12 flex flex-col justify-between">
                        <div>
                            <div class="mb-6">
                                <h1 class="text-2xl md:text-3xl font-light text-gray-900 mb-3"
                                    th:text="${product.productName}">
                                    Product Name
                                </h1>
                                <div class="text-3xl font-bold text-gray-900">
                                    MMK <span th:text="${product.price}">0</span>
                                </div>
                            </div>

                            <p class="text-gray-600 mb-8 leading-relaxed"
                               th:text="${product.description}">
                                Product description
                            </p>

                            <div class="mb-8">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-sm text-gray-500">Stock available:</span>
                                    <span class="font-medium" th:text="${product.quantity}">0</span>
                                </div>
                            </div>
                        </div>

                        <!-- Add to Cart Form -->
                        <form >
                            <input type="hidden" name="productId"
                                   th:value="${product.id}">

                            <div class="space-y-4">
                                <div class="flex items-center gap-4">
                                    <div class="flex-1">
                                        <label class="block text-sm font-medium text-gray-700 mb-2">
                                            Quantity
                                        </label>
                                        <div class="relative">
                                            <input type="number" 
                                                   name="quantity"
                                                   min="1"
                                                   th:attr="max=${product.quantity}"
                                                   value="1"
                                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                        </div>
                                    </div>
                                    <a th:href="@{'/customer/cart/add/' + ${product.id}}"
                                            class="px-8 py-3 bg-black text-white font-medium rounded-lg hover:bg-gray-800 transition-colors mt-6">
                                        Add to Cart
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
             
        </div>
        
    </main>
    <footer th:replace="customer/fragments :: footer" ></footer>
</body>
</html>

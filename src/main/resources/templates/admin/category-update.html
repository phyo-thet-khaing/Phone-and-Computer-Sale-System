<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/fragments :: html-header"></head>

<body class="relative bg-gray-50 min-h-screen">

    <!-- Sidebar -->
    <nav th:replace="admin/fragments :: sidebar"></nav>
    
    <section class="main-content px-6 ml-72 mt-20">

        <!-- Page Header -->
        <div class="mb-10">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Edit Category</h1>
                    <p class="text-gray-500 text-sm mt-1">Update category information</p>
                </div>
            </div>
        </div>

        <!-- Form Container -->
        <div class="max-w-lg mx-auto">
            <!-- Form Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                <form class="space-y-8" method="post" th:action="@{/admin/category-edit/process}">

                    <!-- Hidden ID field -->
                    <input type="hidden" name="id" th:value="${category.id}" />

                    <!-- Category Name Field -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label for="name" class="text-sm font-medium text-gray-800">
                                Category Name
                            </label>
                            <span class="text-xs text-rose-500 font-medium">Required</span>
                        </div>
                        <div class="relative group">
                            <input type="text" id="name" name="name" required
                                   placeholder="Enter category name"
                                   th:value="${category.name}"
                                   class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-xl 
                                          focus:bg-white focus:border-blue-400 focus:ring-4 focus:ring-blue-50 
                                          transition-all duration-200 text-gray-900 placeholder-gray-400
                                          group-hover:border-gray-300" />
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Description Field -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label for="description" class="text-sm font-medium text-gray-800">
                                Description
                            </label>
                            <span class="text-xs text-rose-500 font-medium">Required</span>
                        </div>
                        <div class="relative">
                            <textarea id="description" name="description" required rows="6"
                                      placeholder="Enter description"
                                      th:text="${category.description}"
                                      class="w-full px-4 py-4 bg-gray-50 border border-gray-200 rounded-xl 
                                             focus:bg-white focus:border-blue-400 focus:ring-4 focus:ring-blue-50 
                                             transition-all duration-200 text-gray-900 placeholder-gray-400
                                             resize-none"></textarea>
                            <div class="absolute right-4 top-4 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="pt-4 flex gap-4">
                        <a href="#" th:href="@{/admin/category-list}"
                           class="flex-1 px-6 py-3.5 border border-gray-300 text-gray-700 font-medium rounded-xl
                                  hover:bg-gray-50 active:bg-gray-100 transition-all duration-200 text-center">
                            Cancel
                        </a>
                        <button type="submit"
                                class="flex-1 px-6 py-3.5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-semibold rounded-xl
                                       hover:from-blue-600 hover:to-indigo-700 active:scale-[0.98] transition-all duration-200
                                       shadow-md hover:shadow-lg shadow-blue-200">
                            <div class="flex items-center justify-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                                </svg>
                                <span>Update Category</span>
                            </div>
                        </button>
                    </div>

                    <!-- Edit Info Note -->
                    <div class="pt-6 border-t border-gray-100">
                        <div class="flex items-start gap-3">
                            <div class="w-6 h-6 rounded-full bg-blue-50 flex items-center justify-center flex-shrink-0">
                                <svg class="w-3 h-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                            <p class="text-sm text-gray-500">
                                Updating this category will affect all products associated with it.
                            </p>
                        </div>
                    </div>

                </form>
            </div>

            <!-- Category Info (Optional) -->
            <div class="mt-6">
                <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl p-6 border border-blue-100">
                    <h3 class="text-sm font-semibold text-gray-800 mb-2">Category Information</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <div class="text-xs text-gray-500">Category ID</div>
                            <div class="text-sm font-medium text-gray-900" th:text="${category.id}">#ID</div>
                        </div>
                        <div>
                            <div class="text-xs text-gray-500">Last Updated</div>
                            <div class="text-sm font-medium text-gray-900">Just now</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </section>

    <!-- Optional styling for better visual feedback -->
    <style>
        input:focus, textarea:focus {
            outline: none;
            animation: pulseBlue 2s infinite;
        }
        
        @keyframes pulseBlue {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.1);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(59, 130, 246, 0);
            }
        }
        
        button[type="submit"]:hover {
            transform: translateY(-1px);
        }
    </style>

</body>
</html>

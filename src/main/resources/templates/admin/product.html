<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments :: html-header}"></head>


<body class="relative bg-[#f7f6f9] min-h-screen">

    <!-- Sidebar -->
    <nav th:replace="~{admin/fragments :: sidebar}"></nav>

    <!-- Main Content -->
    <section class="main-content px-8 ml-72 mt-[30px]">

        <!-- Page Title -->
        <h1 class="text-2xl font-semibold mb-6 text-center">Products</h1>

        <!-- Add Product Button + Search Input -->
        <div class="flex flex-wrap justify-between items-center mb-6 gap-4">

            <!-- Add Product Button -->
            <a th:href="@{/admin/product-add}" 
               class="bg-green-500 text-white p-2 rounded hover:bg-green-600 transition w-32 text-center">
                Add Product
            </a>

          <form th:action="@{/admin/product}" method="get" class="flex gap-2">
		    <input type="text"
		           name="search"
		           placeholder="Search products..."
		           th:value="${search}"
		           class="w-64 p-2 border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-green-400" />
		
		    <button type="submit"
		            class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
		        Search
		    </button>
		</form>
		
				<a th:href="@{/admin/product/download/excel(
		        search=${search},
		        sort=${sortField},
		        dir=${sortDir}
		)}"
		   class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
		    Export Excel
		</a>
				<form th:action="@{/admin/product/import-excel}" method="post" enctype="multipart/form-data" class="flex items-center gap-2">
		    
		    <!-- File input -->
		    <input type="file" name="file" accept=".xlsx,.xls" 
		           class="border p-2 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-green-400" required />
		
		    <!-- Submit button -->
		    <button type="submit" 
		            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
		        Import Excel
		    </button>
		
		</form>

		


        <!-- Products Table -->
        <div class="overflow-x-auto bg-white rounded-lg shadow">
            <table class="min-w-full table-auto divide-y divide-gray-200">

                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700 w-10">#</th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700 w-32">
                        	<a th:href="@{/admin/product(sort='productName', 
                        	dir=${sortField == 'productName' ? reverseDir : 'asc'}, 
                        	search=${search}, 
                        	page=${currentPage})}">
                                      Name
                                      <span th:text="${sortField == 'productName' ? (sortDir=='asc' ? '▲':'▼') : ''}"></span>
                                  </a>
                        </th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700 w-20">Image</th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700 w-64">Description</th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700 w-32">
					        <a th:href="@{/admin/product(
					        sort='category.name',
					        dir=${sortField == 'category.name' ? reverseDir : 'asc'},
					        search=${search},
					        page=${currentPage}
					    )}">
					    Category
    					<span th:text="${sortField == 'category.name' ? (sortDir=='asc' ? '▲' : '▼') : ''}"></span>
						</a>
                        		
                        </th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700 w-20">Quantity</th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700 w-24">
                        	
                        <a th:href="@{/admin/product(
					        sort='price',
					        dir=${sortField == 'price' ? reverseDir : 'asc'},
					        search=${search},
					        page=${currentPage}
    					)}">
    						Price
    					<span th:text="${sortField == 'price' ? (sortDir=='asc' ? '▲' : '▼') : ''}"></span>
						</a>
						</th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700 w-32">Arrive Date</th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700 w-32">Actions</th>
                    </tr>
                </thead>

                <tbody class="divide-y divide-gray-200">
                    <tr class="hover:bg-gray-50" th:each="product, stat : ${products}">

                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${stat.index + 1}"></td>

                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${product.productName}"></td>

                        <!-- Product Image -->
                        <td class="px-6 py-4 text-sm text-gray-700">
                            <img th:src="@{${'/Upload/' + product.image}}"
                                 alt="Product Images"
                                 class="w-16 h-16 object-cover rounded" />
                        </td>

                        <!-- Description -->
                        <td class="px-6 py-4 text-sm text-gray-700 max-w-[250px] truncate"
                            th:text="${product.description}"></td>

                        <!-- Category -->
                        <td class="px-6 py-4 text-sm text-gray-700"
                            th:text="${product?.category?.name != null ? product.category.name : 'No category'}"></td>

                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${product.quantity}"></td>

                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${product.price}"></td>

                        <!-- Arrive Date -->
                        <td class="px-6 py-4 text-sm text-gray-700"
                            th:text="${#dates.format(product.date, 'yyyy-MM-dd')}"></td>

                        <!-- Actions -->
                        <td class="px-6 py-4 text-sm text-gray-700 flex gap-2">

                            <!-- Edit Button -->
                            <a th:href="@{'/admin/product/edit/' + ${product.id}}"
                               class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 transition">
                                Edit
                            </a>

                            <!-- Delete Button -->
                            <a id="deleteProduct" 
                               th:href="@{'/admin/product/delete/'+${product.id}}" 
                               th:attr="data-id=${product.id}"
                               onclick="confirmDeleteProduct(event,this)"
                               class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition">
                                Delete
                            </a>

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <nav aria-label="Page navigation example" class="mt-6 flex justify-center">
            <div class="inline-flex rounded-lg shadow-sm -space-x-px" role="group">

                <!-- Previous Button -->
                <a th:if="${currentPage > 1}" 
                   th:href="@{/admin/product(page=${currentPage - 1})}"
                   class="inline-flex items-center justify-center text-gray-600 bg-white rounded-l-lg 
                          box-border border border-gray-300 hover:bg-gray-100 hover:text-indigo-600 
                          focus:ring-2 focus:ring-indigo-500 leading-5 w-10 h-10 transition duration-150">
                    <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" 
                         viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="m15 19-7-7 7-7"/>
                    </svg>
                </a>

                <!-- Disabled Previous -->
                <button th:if="${currentPage == 1}" type="button" disabled
                        class="inline-flex items-center justify-center text-gray-400 bg-gray-50 rounded-l-lg 
                               box-border border border-gray-300 leading-5 w-10 h-10 cursor-not-allowed">
                    <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" 
                         viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="m15 19-7-7 7-7"/>
                    </svg>
                </button>

                <!-- Page Info -->
                <button type="button"
                        class="inline-flex shrink-0 text-sm items-center justify-center text-gray-700 bg-white 
                               box-border border-t border-b border-gray-300 leading-5 px-3 h-10 font-medium">
                    <span th:text="'Page ' + ${currentPage} + ' of ' + ${totalPages}">Page 1 of 10</span>
                </button>

                <!-- Next Button -->
                <a th:if="${currentPage < totalPages}" 
                   th:href="@{/admin/product(page=${currentPage + 1})}"
                   class="inline-flex items-center justify-center text-gray-600 bg-white rounded-r-lg 
                          box-border border border-gray-300 hover:bg-gray-100 hover:text-indigo-600 
                          focus:ring-2 focus:ring-indigo-500 leading-5 w-10 h-10 transition duration-150">
                    <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" 
                         viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="m9 5 7 7-7 7"/>
                    </svg>
                </a>

                <!-- Disabled Next -->
                <button th:if="${currentPage == totalPages}" type="button" disabled
                        class="inline-flex items-center justify-center text-gray-400 bg-gray-50 rounded-r-lg 
                               box-border border border-gray-300 leading-5 w-10 h-10 cursor-not-allowed">
                    <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" 
                         viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="m9 5 7 7-7 7"/>
                    </svg>
                </button>

            </div>
        </nav>

    </section>

    <!-- CoolAlertJS -->
    <script src="https://cdn.jsdelivr.net/npm/coolalertjs@latest/dist/coolalert.min.js"></script>

    <script>
        function confirmDeleteProduct(event, element) {
            event.preventDefault();

            const productId = element.getAttribute("data-id");
            if (!productId) return;

            CoolAlert.show({
                title: "Are you sure?",
                text: "This action will permanently delete the product!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Yes, delete it!"
            }).then((result) => {
                if (result.isConfirmed) {
                    CoolAlert.show(
                        "Deleted!",
                        "The product has been successfully deleted.",
                        "success"
                    ).then(() => {
                        window.location.href = "/admin/product/delete/" + productId;
                    });
                }
            });
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/fragments :: html-header"></head>

<body class="relative bg-[#f7f6f9] h-full min-h-screen">

    <!-- Sidebar -->
    <nav th:replace="admin/fragments :: sidebar"></nav>

    <!-- MAIN CONTENT -->
    <main class="ml-72 p-8">

        <!-- HEADER -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-700">FAQ Management</h1>

            <a href="/admin/faq-add"
               class="px-4 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow">
                + Add FAQ
            </a>
        </div>

        <!-- FAQ TABLE -->
        <div class="bg-white rounded-2xl shadow-md p-6">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-indigo-600 text-white">
                        <th class="py-3 px-4 rounded-l-xl">ID</th>
                        <th class="py-3 px-4">Question</th>
                        <th class="py-3 px-4">Answer</th>
                        <th class="py-3 px-4 text-center rounded-r-xl">Actions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="faq : ${faqs}" class="border-b hover:bg-gray-50">
                        <td class="py-3 px-4" th:text="${faq.id}"></td>

                        <td class="py-3 px-4 font-medium" th:text="${faq.question_name}"></td>

                        <td class="py-3 px-4 text-gray-600" th:text="${faq.answer}"></td>

                        <td class="py-3 px-4 flex gap-2 justify-center">

                            <a th:href="@{'/admin/faq/edit/' + ${faq.id}}"
                               class="px-3 py-1 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600">
                               Edit
                            </a>

                            <a id="deleteFaq" 
							   th:href="@{'/admin/faq/delete/' + ${faq.id}}" 
							   th:attr="data-id=${faq.id}"
							   onclick="confirmDelete(event,this)"
                               class="px-3 py-1 bg-red-600 text-white rounded-lg hover:bg-red-700"
                               >
                               Delete
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>
<!-- Include CoolAlertJS -->
<script src="https://cdn.jsdelivr.net/npm/coolalertjs@latest/dist/coolalert.min.js"></script>

<script>
function confirmDelete(event, element) {
    event.preventDefault(); // Stop default link navigation

    let faqId = element.getAttribute("data-id");
    if (!faqId) {
        console.error("FAQ ID is null or undefined");
        return;
    }

    // CoolAlert confirmation
    CoolAlert.show({
        title: "Are you sure?",
        text: "You won't be able to revert this!",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Yes, delete it!"
    }).then((result) => {
        if (result.isConfirmed) {
            // Show success alert first
            CoolAlert.show(
                "Deleted!", 
                "Your FAQ has been deleted.", 
                "success"
            ).then(() => {
                // Redirect to delete URL after success alert
                window.location.href = "/admin/faq/delete/" + faqId;
            });
        }
    });
}
</script>
</body>
</html>

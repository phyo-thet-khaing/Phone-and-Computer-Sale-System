<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/fragments :: html-header"></head>

<body class="relative bg-[#f7f6f9] h-full min-h-screen">

    <!-- Sidebar -->
    <nav th:replace="admin/fragments :: sidebar"></nav>

    <!-- MAIN CONTENT -->
    <main class="ml-72 p-8">

        <!-- Header -->
        <h1 class="text-3xl font-bold text-gray-700 mb-6">Add FAQ</h1>

        <div class="bg-white shadow-md rounded-2xl p-8 w-full max-w-3xl">

            <form th:action="@{/admin/faq-add/process}" method="post" th:object="${faq}">

                <!-- Question Name -->
                <div class="mb-6">
                    <label class="block text-lg font-semibold text-gray-700 mb-2">
                        Question
                    </label>
                    <input type="text" th:field="*{question_name}"
                           placeholder="Enter FAQ question"
                           class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- Answer -->
                <div class="mb-6">
                    <label class="block text-lg font-semibold text-gray-700 mb-2">
                        Answer
                    </label>
                    <textarea th:field="*{answer}"
                              placeholder="Enter the answer"
                              rows="4"
                              class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <!-- Buttons -->
                <div class="flex justify-between mt-8">

                    <a href="/admin/faq"
                       class="px-5 py-3 bg-gray-300 text-gray-700 rounded-xl hover:bg-gray-400">
                        Cancel
                    </a>

                    <button type="submit"
                            class="px-6 py-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow-lg">
                        Save FAQ
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>
</html>

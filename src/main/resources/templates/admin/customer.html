<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/fragments :: html-header"></head>

<body class="relative bg-[#f7f6f9] min-h-screen">

    <!-- Sidebar -->
    <nav th:replace="admin/fragments :: sidebar"></nav>

    <!-- MAIN CONTENT -->
    <main class="ml-72 p-10">

        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Customer List</h1>
            <a href="/admin/customer-add"
               class="px-5 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700 transition">
                + Add Customer
            </a>
        </div>

        <!-- Customer Table -->
        <div class="overflow-x-auto bg-white shadow-lg rounded-xl">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gradient-to-r from-indigo-500 to-purple-500 text-white">
                    <tr>
                        <th class="px-6 py-3 text-left text-sm font-semibold uppercase">ID</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold uppercase">Name</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold uppercase">Email</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold uppercase">Phone</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold uppercase">Address</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold uppercase">Actions</th>
                    </tr>
                </thead>

                <tbody class="bg-white divide-y divide-gray-100">
                    <tr th:each="c : ${customers}" class="hover:bg-indigo-50 transition">
                        <!-- ID -->
                        <td class="px-6 py-4 font-medium text-gray-700" th:text="${c.id}"></td>

                        <!-- Name -->
                        <td class="px-6 py-4 text-gray-700" th:text="${c.name}"></td>

                        <!-- Email -->
                        <td class="px-6 py-4 text-gray-600" th:text="${c.email}"></td>

                        <!-- Phone -->
                        <td class="px-6 py-4 text-gray-600" th:text="${c.phone}"></td>

                        <!-- Address -->
                        <td class="px-6 py-4 text-gray-600" th:text="${c.address}"></td>

                        <!-- Actions -->
                        <td class="px-6 py-4 flex gap-2">
                           
                            <a id="deleteCustomer"
							   th:href="@{'/admin/customer-delete/' + ${c.id}}"
							   th:attr="data-id=${c.id}"
							   onclick="confirmDelete(event, this)"
							   class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition">
							    Delete
							</a>
                        </td>
                    </tr>

                    <!-- Empty State -->
                    <tr th:if="${#lists.isEmpty(customers)}">
                        <td colspan="6" class="px-6 py-4 text-center text-gray-500">
                            No customers found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>
    
 <script src="https://cdn.jsdelivr.net/npm/coolalertjs@latest/dist/coolalert.min.js"></script>

<script>
function confirmDelete(event, element) {
    event.preventDefault(); // Stop default navigation

    let customerId = element.getAttribute("data-id");
    if (!customerId) return;

    CoolAlert.show({
        title: "Are you sure?",
        text: "You won't be able to revert this!",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Yes, delete it!"
    }).then((result) => {
        if (result.isConfirmed) {
            // Show success alert
            CoolAlert.show("Deleted!", "Customer has been deleted.", "success")
                     .then(() => {
                         // Redirect to delete URL
                         window.location.href = "/admin/customer/delete/" + customerId;
                     });
        }
    });
}
</script>
</body>
</html>

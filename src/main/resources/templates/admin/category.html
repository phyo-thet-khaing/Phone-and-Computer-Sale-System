<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/fragments :: html-header">
    <title>Category Management</title>
    <script src="https://cdn.tailwindcss.com"></script>


</head>

<body class="relative bg-gray-100 h-full min-h-screen">

    <!-- Sidebar -->
    <nav th:replace="admin/fragments :: sidebar"></nav>

    <section class="main-content px-8 ml-72 mt-[70px]">

        <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Categories</h1>

        <!-- Add Category Input + Button & Search Input -->
        <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
            <div class="flex flex-wrap gap-2 items-center">
                <input type="text" placeholder="Category Name"
                       class="p-2 border rounded w-48 focus:outline-none focus:ring-2 focus:ring-green-400" />
                <a href="/admin/category-add"
                   class="bg-green-500 text-white p-2 rounded hover:bg-green-600 transition w-32 text-center inline-block">
                    Add Category
                </a>
            </div>
            <input type="text" placeholder="Search categories..."
                   class="w-64 p-2 border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-green-400" />
        </div>

        <!-- Categories Table -->
        <div class="overflow-x-auto bg-white rounded-lg shadow w-full">
            <table class="min-w-full w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700">ID</th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700">Name</th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700">Description</th>
                        <th class="px-6 py-3 text-left text-sm font-medium text-gray-700">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr class="hover:bg-gray-50" th:each="category, categoryStat : ${categories}">
                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${categoryStat.index + 1}">1</td>
                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${category.name}">Electronics</td>
                        <td class="px-6 py-4 text-sm text-gray-700" th:text="${category.description}">Devices</td>
                        <td class="px-6 py-4 text-sm text-gray-700 flex gap-2">

                            <!-- Edit Button -->
                            <a th:href="@{'/admin/category/edit/' + ${category.id}}"
                               class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 transition">
                                Edit
                            </a>

                            <!-- Delete Button -->
                            <a id="deleteCategory" 
                            th:href="@{'/admin/category/delete/'+${category.id}}" 
                            th:attr="data-id=${category.id}"
                            onclick="confirmDelete(event,this)"
                            class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition"
                               >
                                Delete
                            </a>

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>
    
     <!-- Include CoolAlertJS -->
<script src="https://cdn.jsdelivr.net/npm/coolalertjs@latest/dist/coolalert.min.js"></script>

<script>
function confirmDelete(event, element) {
    event.preventDefault(); // Stop default link navigation

    let categoryId = element.getAttribute("data-id");
    if (!categoryId) {
        console.error("Category ID is null or undefined");
        return;
    }

    // CoolAlert confirmation
    CoolAlert.show({
        title: "Are you sure?",
        text: "You won't be able to revert this!",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Yes, delete it!"
    }).then((result) => {
        if (result.isConfirmed) {
            // Show success alert first
            CoolAlert.show(
                "Deleted!", 
                "Your category has been deleted.", 
                "success"
            ).then(() => {
                // Redirect to delete URL after success alert
                window.location.href = "/admin/category/delete/" + categoryId;
            });
        }
    });
}
</script>
</body>
</html>

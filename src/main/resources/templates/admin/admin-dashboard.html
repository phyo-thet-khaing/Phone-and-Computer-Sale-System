<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/fragments :: html-header">

</head>

<body class="relative bg-[#f7f6f9] h-full min-h-screen">

    <!-- Sidebar -->
    <nav th:replace="admin/fragments :: sidebar"></nav>

    <!-- Main Content -->
    <section class="main-content  px-8 ml-72 mt-[70px]">
        <h1 class="text-2xl font-semibold mb-6">Dashboard</h1>

        <!-- Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white p-6 rounded-lg shadow">
                <p class="text-gray-500">Total Users</p>
                <h2 class="text-3xl font-bold" th:text="${totalUsers}">1,245</h2>
            </div>

            <div class="bg-white p-6 rounded-lg shadow">
                <p class="text-gray-500">Total Sales</p>
                <h2 class="text-3xl font-bold" th:text="${totalSales}">$32,500</h2>
            </div>

            <div class="bg-white p-6 rounded-lg shadow">
                <p class="text-gray-500">New Orders</p>
                <h2 class="text-3xl font-bold" th:text="${newOrders}">78</h2>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- Bar Chart -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4">Monthly Sales</h2>
                <canvas id="barChart"></canvas>
            </div>

            <!-- Line Chart -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold mb-4">Visitors Growth</h2>
                <canvas id="lineChart"></canvas>
            </div>

        </div>
    </section>

    <!-- Chart.js (must be placed AFTER fragment head) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Charts Script -->
    <script>
        // Bar Chart
        const barCtx = document.getElementById("barChart").getContext("2d");
        new Chart(barCtx, {
            type: "bar",
            data: {
                labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
                datasets: [{
                    label: "Sales",
                    data: [1200, 1900, 900, 1500, 2000, 2500],
                    backgroundColor: "rgba(34, 197, 94, 0.6)",
                    borderColor: "rgba(34, 197, 94, 1)",
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });

        // Line Chart
        const lineCtx = document.getElementById("lineChart").getContext("2d");
        new Chart(lineCtx, {
            type: "line",
            data: {
                labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                datasets: [{
                    label: "Visitors",
                    data: [300, 500, 400, 700, 900, 1200, 1500],
                    fill: false,
                    borderColor: "rgba(59, 130, 246, 1)",
                    tension: 0.4
                }]
            },
            options: {
                responsive: true
            }
        });
    </script>

</body>
</html>

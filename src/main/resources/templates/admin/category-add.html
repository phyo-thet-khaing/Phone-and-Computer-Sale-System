<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="admin/fragments :: html-header"></head>

<body class="relative bg-gray-50 min-h-screen">

    <!-- Sidebar -->
    <nav th:replace="admin/fragments :: sidebar"></nav>
    
    <section class="main-content px-6 ml-72 mt-20">

        <!-- Page Header -->
        <div class="mb-10">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-50 to-green-50 flex items-center justify-center">
                    <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Create New Category</h1>
                    <p class="text-gray-500 text-sm mt-1">Organize your products with categories</p>
                </div>
            </div>
        </div>

        <!-- Form Container -->
        <div class="max-w-lg mx-auto">
            <!-- Form Card with subtle shadow -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                <form method="post" th:action="@{/admin/category-add/process}" class="space-y-8">
                    
                    <!-- Category Name Field -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label for="name" class="text-sm font-medium text-gray-800">
                                Category Name
                            </label>
                            <span class="text-xs text-rose-500 font-medium">Required</span>
                        </div>
                        <div class="relative group">
                            <input type="text" id="name" name="name" required
                                   placeholder="e.g., Electronics, Clothing, Home Decor"
                                   class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-200 rounded-xl 
                                          focus:bg-white focus:border-emerald-400 focus:ring-4 focus:ring-emerald-50 
                                          transition-all duration-200 text-gray-900 placeholder-gray-400
                                          group-hover:border-gray-300" />
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-emerald-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Description Field -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label for="description" class="text-sm font-medium text-gray-800">
                                Description
                            </label>
                            <span class="text-xs text-rose-500 font-medium">Required</span>
                        </div>
                        <div class="relative">
                            <textarea id="description" name="description" required rows="6"
                                      placeholder="Describe what products belong to this category..."
                                      class="w-full px-4 py-4 bg-gray-50 border border-gray-200 rounded-xl 
                                             focus:bg-white focus:border-emerald-400 focus:ring-4 focus:ring-emerald-50 
                                             transition-all duration-200 text-gray-900 placeholder-gray-400
                                             resize-none"></textarea>
                            <div class="absolute right-4 top-4 text-gray-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Character Count (Optional) -->
                    <div class="text-right">
                        <span class="text-xs text-gray-400">Max 500 characters</span>
                    </div>

                    <!-- Form Actions -->
                    <div class="pt-4 flex gap-4">
                        <button type="button"
                                class="flex-1 px-6 py-3.5 border border-gray-300 text-gray-700 font-medium rounded-xl
                                       hover:bg-gray-50 active:bg-gray-100 transition-all duration-200">
                            Cancel
                        </button>
                        <button type="submit"
                                class="flex-1 px-6 py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-white font-semibold rounded-xl
                                       hover:from-emerald-600 hover:to-green-700 active:scale-[0.98] transition-all duration-200
                                       shadow-md hover:shadow-lg shadow-emerald-200">
                            <div class="flex items-center justify-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                                </svg>
                                <span>Create Category</span>
                            </div>
                        </button>
                    </div>

                    <!-- Help Text -->
                    <div class="pt-6 border-t border-gray-100">
                        <div class="flex items-start gap-3">
                            <div class="w-6 h-6 rounded-full bg-emerald-50 flex items-center justify-center flex-shrink-0">
                                <svg class="w-3 h-3 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                            <p class="text-sm text-gray-500">
                                Categories help organize your products. Choose a clear, descriptive name that customers will understand.
                            </p>
                        </div>
                    </div>

                </form>
            </div>

            <!-- Form Stats (Optional) -->
            <div class="mt-6 grid grid-cols-2 gap-4">
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                    <div class="text-sm text-gray-500 mb-1">Total Categories</div>
                    <div class="text-2xl font-bold text-gray-900" th:text="${totalCategories}">0</div>
                </div>
                <div class="bg-white rounded-xl p-4 border border-gray-100">
                    <div class="text-sm text-gray-500 mb-1">Last Added</div>
                    <div class="text-lg font-semibold text-gray-900" th:text="${lastCategory}">None</div>
                </div>
            </div>

        </div>

    </section>

    <!-- Optional animation for form focus -->
    <style>
        input:focus, textarea:focus {
            outline: none;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.1);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(52, 211, 153, 0);
            }
        }
        
        button[type="submit"]:hover {
            transform: translateY(-1px);
        }
    </style>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
     <link rel="icon" th:href="@{/image/phone.jpg}" type="image/jpeg">

</head>
<body class="bg-gray-100">

    <div class="min-h-screen flex">
        <!-- Left image -->
        <div class="hidden md:flex w-1/2">
            <img src="https://readymadeui.com/image-3.webp" 
                 class="w-full h-full object-cover" 
                 alt="login-image" />
        </div>

        <!-- Login form -->
         
        <div class="flex w-full md:w-1/2 justify-center items-center">
            <form th:action="@{/admin/login/process}" th:object="${admin}" class="bg-white p-8 rounded shadow-md w-full max-w-md">
                
                <h1 class="text-3xl font-bold text-gray-900 mb-4">Sign in</h1>
                <p class="text-gray-600 text-sm mb-6">
                    Don't have an account? 
                    <a href="#" class="text-blue-600 font-medium hover:underline">Register here</a>
                </p>

				              <!-- Email -->
				<div class="mb-6">
				    <label for="email" class="block text-gray-700 text-sm font-semibold mb-2">Email Address</label>
				    <input
				        id="email"
				        name="email"
				        th:field="*{email}"
				        type="email"
				        required
				        class="w-full px-4 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
				        placeholder="Enter your email"
				    />
				</div>
				
				<!-- Password -->
				<div class="mb-6">
				    <label for="password" class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
				    <input
				        id="password"
				        name="password"
				        th:field="*{password}"
				        type="password"
				        required
				        class="w-full px-4 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
				        placeholder="Enter your password"
				    />
				</div>


                <!-- Remember & forgot -->
                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center text-sm text-gray-700">
                        <input type="checkbox" class="mr-2 w-4 h-4 text-blue-600 border-gray-300 rounded">
                        Remember me
                    </label>
                    <a href="#" class="text-blue-600 text-sm hover:underline">Forgot Password?</a>
                </div>

                <!-- Sign in button -->
                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded mb-4">
                    Sign in
                </button>

                <!-- Divider -->
                <div class="flex items-center mb-4">
                    <hr class="flex-grow border-gray-300">
                    <span class="mx-2 text-gray-500 text-sm">or</span>
                    <hr class="flex-grow border-gray-300">
                </div>

                <!-- Google button -->
                <button type="button"
                        class="w-full flex items-center justify-center gap-2 py-3 px-4 border border-gray-300 rounded hover:bg-gray-50">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="0 0 512 512">
                        <path fill="#fbbb00" d="M120 256c0-25.367 6.989-49.13 19.131-69.477v-86.308H52.823C18.568 144.703 0 198.922 0 256s18.568 111.297 52.823 155.785h86.308v-86.308C126.989 305.13 120 281.367 120 256z"/>
                        <path fill="#0f9d58" d="m256 392-60 60 60 60c57.079 0 111.297-18.568 155.785-52.823v-86.216h-86.216C305.044 385.147 281.181 392 256 392z"/>
                        <path fill="#31aa52" d="m139.131 325.477-86.308 86.308a260.085 260.085 0 0 0 22.158 25.235C123.333 485.371 187.62 512 256 512V392c-49.624 0-93.117-26.72-116.869-66.523z"/>
                        <path fill="#3c79e6" d="M512 256a258.24 258.24 0 0 0-4.192-46.377l-2.251-12.299H256v120h121.452a135.385 135.385 0 0 1-51.884 55.638l86.216 86.216a260.085 260.085 0 0 0 25.235-22.158C485.371 388.667 512 324.38 512 256z"/>
                        <path fill="#cf2d48" d="m352.167 159.833 10.606 10.606 84.853-84.852-10.606-10.606C388.668 26.629 324.381 0 256 0l-60 60 60 60c36.326 0 70.479 14.146 96.167 39.833z"/>
                        <path fill="#eb4132" d="M256 120V0C187.62 0 123.333 26.629 74.98 74.98a259.849 259.849 0 0 0-22.158 25.235l86.308 86.308C162.883 146.72 206.376 120 256 120z"/>
                    </svg>
                    Continue with Google
                </button>

            </form>
        </div>
    </div>

</body>
</html>
